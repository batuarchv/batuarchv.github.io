<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>batuarchv</title>
<meta name="description" content="batuarchv — cover artist & visual designer. Album covers, single artwork and release visuals.">
<meta property="og:title" content="batuarchv">
<meta property="og:description" content="Cover art & visual worlds for music.">
<meta property="og:image" content="https://batuarchv.github.io/assets/img/80b-cover.webp">
<meta name="theme-color" content="#f4f5f6">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cursors.css">
<style>
:root{
  --bg:#f4f5f6; --stripe:#e9ebed; --tile:#fdfdfd; --edge:#c8ccd1; --ink:#5b6066; --ink-strong:#33373c; --muted:#9aa0a6;
  --blue:#34bdef; --blue-deep:#1a9ad4; --glow:rgba(52,189,239,.42); --navy:#17176b;
  --bar-top:#f5f6f7; --bar-bot:#e1e4e7; --bar-edge:#c4c8cc;
  --ease:cubic-bezier(.22,.8,.24,1); --s:1;
}
/* The Wii look is a light theme on purpose; dark mode only deepens the stripes a touch. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#eceef0; --stripe:#e0e3e6; } }
:root[data-theme="dark"]{ --bg:#eceef0; --stripe:#e0e3e6; }
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--bg) repeating-linear-gradient(180deg,transparent 0 3px,var(--stripe) 3px 4px)}
body{
  font:500 15px/1.45 "M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0}
img,video{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.paused .view *,body.ch-open .view *,body.paused #boot *,body.ch-open .round::after,body.paused .round::after{animation-play-state:paused!important}

/* ───────────────────────── disc (shared) ───────────────────────── */
.disc{position:relative;border-radius:50%;aspect-ratio:1;
  background:conic-gradient(from 30deg,#eef2f6,#cfefff,#f3d9ff,#fff6c9,#d7ffe9,#eef2f6,#cfe3ff,#ffd9ec,#eef2f6);
  -webkit-mask:radial-gradient(circle,transparent 0 6.6%,#000 7%);mask:radial-gradient(circle,transparent 0 6.6%,#000 7%);
}
.disc svg{position:absolute;inset:0;width:100%;height:100%}
.spin{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────────────────────── boot ───────────────────────── */
#boot{position:fixed;inset:0;z-index:80;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 45%,#fff 0 40%,#f1f3f5 75%,#e6e9ec 100%);transition:opacity .6s}
#boot::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.018) 3px 4px);pointer-events:none}
#boot.gone{opacity:0;pointer-events:none}
.boot-copy{position:absolute;left:clamp(20px,7vw,110px);top:50%;transform:translateY(-50%);max-width:min(36ch,40vw);z-index:1}
.boot-copy .kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-deep)}
.boot-copy h1{font-size:clamp(34px,5vw,64px);font-weight:800;color:var(--ink-strong);line-height:1;margin-top:10px}
.boot-copy p{margin-top:14px;font-size:clamp(14px,1.4vw,17px)}
.boot-copy .chev{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.boot-copy .chev i{width:8px;height:8px;border-top:3px solid var(--blue);border-right:3px solid var(--blue);transform:rotate(45deg);opacity:.2;animation:chev 1.4s infinite}
.boot-copy .chev i:nth-child(2){animation-delay:.15s}.boot-copy .chev i:nth-child(3){animation-delay:.3s}
@keyframes chev{40%{opacity:1}}
.skip{position:absolute;left:clamp(20px,7vw,110px);bottom:22px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;z-index:2}
.skip:hover{color:var(--blue-deep)}

#bootDisc{position:absolute;z-index:2;width:clamp(180px,21vw,290px);left:44%;top:50%;translate:-50% -50%;
  filter:drop-shadow(0 18px 22px rgba(30,40,60,.16));touch-action:none;user-select:none;-webkit-user-drag:none}
#bootDisc.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(6deg)}}
.disc-shadow{position:absolute;z-index:1;left:44%;top:calc(50% + clamp(110px,13vw,170px));width:clamp(140px,16vw,220px);height:18px;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.12),transparent);animation:shadow 3.2s ease-in-out infinite}
@keyframes shadow{50%{transform:scale(.86);opacity:.7}}
#boot.inserting .disc-shadow{opacity:0;transition:opacity .3s}

.console{position:absolute;z-index:3;right:clamp(-34px,-2vw,-8px);top:50%;height:min(80vh,660px);aspect-ratio:160/640;translate:0 -50%;pointer-events:none}
.console svg{width:100%;height:100%;display:block;filter:drop-shadow(-18px 22px 26px rgba(20,30,40,.12))}
.console .slot-glow{position:absolute;left:21.4%;width:3.6%;top:17.5%;height:42.2%;border-radius:99px;background:#7fd8ff;opacity:0;
  box-shadow:0 0 6px 2px rgba(52,189,239,.9),0 0 26px 10px rgba(52,189,239,.55),0 0 70px 26px rgba(52,189,239,.25);transition:opacity .35s}
#boot.near .slot-glow{opacity:.45}
#boot.on .slot-glow{opacity:1;animation:slot 1.1s ease-in-out infinite alternate}
@keyframes slot{from{opacity:.55}to{opacity:1}}
.console .pwr{transition:fill .3s}
#boot.on .console .pwr{fill:#34bdef}
.whiteout{position:absolute;inset:0;z-index:6;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#boot.white .whiteout{opacity:1}

/* ───────────────────────── menu ───────────────────────── */
.menu{position:relative;max-width:1220px;margin:0 auto;padding:clamp(40px,6vh,72px) clamp(44px,5vw,64px) 210px}
.pages{overflow:hidden;margin:-14px;padding:14px}
.track{display:flex;transition:transform .6s var(--ease);will-change:transform}
.page{flex:0 0 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.5vw,20px);padding:6px;align-content:start}
.tile{position:relative;aspect-ratio:16/10;border-radius:clamp(14px,1.8vw,22px);background:var(--tile);overflow:hidden;
  border:2px solid var(--edge);box-shadow:inset 0 0 0 3px #fff,0 2px 0 rgba(0,0,0,.035);isolation:isolate;
  transition:transform .18s var(--ease),border-color .18s,box-shadow .18s;opacity:0}
body.booted .tile{animation:tileIn .55s var(--ease) both;animation-delay:calc(var(--i) * 40ms + 120ms)}
@keyframes tileIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.tile:not(.empty):hover,.tile:focus-visible{transform:scale(1.05);border-color:var(--blue);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--glow),0 6px 22px rgba(52,189,239,.28);outline:0;z-index:3}
.tile .view{position:absolute;inset:3px;border-radius:calc(clamp(14px,1.8vw,22px) - 4px);overflow:hidden;z-index:0}
.tile .view>img,.tile .view>.kb,.tile .view>.rot{position:absolute;inset:0;width:100%;height:100%}
.tile img{width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:none}
.tile:not(.empty):hover::after{transform:translateX(120%);transition:transform .7s ease}
.tag{position:absolute;left:8px;bottom:8px;z-index:3;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,255,255,.94);border:2px solid #dfe2e5;border-radius:99px;padding:1px 11px;font-size:12px;font-weight:700;color:var(--ink-strong);transition:border-color .18s}
.tile:hover .tag,.tile:focus-visible .tag{border-color:var(--blue)}
.tile.empty{background:repeating-linear-gradient(180deg,#f6f7f8 0 3px,#eceef0 3px 4px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}

/* tile motion: ken burns, crossfade, scroll */
.kb{overflow:hidden}
.kb img,.rot img{animation:kb 14s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}
.rot img{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.rot img.on{opacity:1}
.mos{display:grid;grid-template-columns:repeat(3,1fr);height:100%;gap:2px;background:#fff}
.mos .rot{position:relative}
.strip{position:absolute;inset:0;display:flex;width:200%;animation:strip 26s linear infinite}
.strip img{width:50%;height:100%;object-fit:cover}
@keyframes strip{to{transform:translateX(-50%)}}
.t80 .card{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;translate:-50% -50%;border-radius:8px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.tdisc{display:flex;align-items:center;justify-content:center;gap:6%;height:100%;background:linear-gradient(160deg,#fff 0%,#eaf6fd 100%)}
.tdisc .disc{height:72%;filter:drop-shadow(0 6px 10px rgba(20,30,60,.15))}
.tdisc b{display:block;font-size:clamp(14px,1.7vw,22px);font-weight:800;color:var(--navy);line-height:1.05}
.tdisc small{display:block;font-size:clamp(10px,1vw,12px);color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tvid .play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;z-index:2;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(52,189,239,.6);animation:ping 2.2s ease-out infinite}
.tvid .play::before{content:"";border-left:14px solid var(--blue);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,189,239,.55)}80%,100%{box-shadow:0 0 0 18px rgba(52,189,239,0)}}
.tcur{position:relative;height:100%}
.tcur .fly{position:absolute;width:15%;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));animation:fly 7s ease-in-out infinite}
.tcur .fly.b{width:12%;animation-duration:9s;animation-delay:-3s}
@keyframes fly{0%{left:12%;top:58%;transform:rotate(-8deg)}25%{left:62%;top:22%;transform:rotate(6deg)}50%{left:78%;top:60%;transform:rotate(-4deg)}75%{left:34%;top:30%;transform:rotate(8deg)}100%{left:12%;top:58%;transform:rotate(-8deg)}}
.tmail{display:grid;place-items:center;height:100%;background:linear-gradient(160deg,#fff,#e8f5fc)}
.tmail .env{width:34%;position:relative;animation:bob 3s ease-in-out infinite}
.tmail .env svg{width:100%;height:auto;display:block}
.tmail .badge{position:absolute;right:-12%;top:-18%;width:30%;aspect-ratio:1;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center;font-size:clamp(10px,1vw,14px);box-shadow:0 0 0 3px #fff}
.tile video.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;z-index:1}
.tile video.hv.on{opacity:1}

/* page arrows + dots */
.arrow{position:absolute;top:calc(50% - 90px);z-index:4;width:44px;height:64px;display:grid;place-items:center;border-radius:16px;
  background:rgba(255,255,255,.9);border:2px solid #d6dade;box-shadow:0 3px 0 #c9ced3;transition:opacity .25s,transform .18s,border-color .18s}
.arrow svg{width:20px}
.arrow:hover{border-color:var(--blue);transform:scale(1.08)}
.arrow.prev{left:4px}.arrow.next{right:4px}
.arrow[hidden]{display:grid;opacity:0;pointer-events:none}
.dots{display:flex;justify-content:center;gap:10px;margin-top:22px}
.dots button{width:11px;height:11px;border-radius:50%;background:#cfd3d7;transition:background .2s,transform .2s}
.dots button.on{background:var(--blue);transform:scale(1.2)}

/* ───────────────────────── bottom bar ───────────────────────── */
.bar{position:fixed;left:0;right:0;bottom:0;height:calc(150px * var(--s));z-index:10;display:flex;pointer-events:none}
.bar .side{flex:none;width:calc(220px * var(--s));height:100%;position:relative}
.bar .side>svg{width:100%;height:100%;display:block;overflow:visible}
.bar .side.r>svg{transform:scaleX(-1)}
.bar .mid{flex:1;position:relative;margin-top:calc(60px * var(--s));border-top:3px solid var(--bar-edge);
  background:linear-gradient(#f5f6f7 0 4.5px,#34bdef 4.5px 6.5px,transparent 6.5px),linear-gradient(var(--bar-top),var(--bar-bot))}
.round{position:absolute;top:calc(36px * var(--s));left:calc(54px * var(--s));width:calc(112px * var(--s));height:calc(112px * var(--s));border-radius:50%;pointer-events:auto;
  background:radial-gradient(circle at 50% 30%,#fff 0 52%,#eceef0 100%);border:3px solid #cbd0d4;box-shadow:0 3px 0 #b9bec3,inset 0 -4px 8px rgba(0,0,0,.04);
  display:grid;place-items:center;transition:border-color .18s,transform .18s,box-shadow .18s}
.round:hover,.round:focus-visible{border-color:var(--blue);box-shadow:0 3px 0 #b9bec3,0 0 0 4px var(--glow);transform:translateY(-2px);outline:0}
.round img{width:62%}
.round svg{width:44%}
.round.mail::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--blue);opacity:0;animation:mailping 2.6s ease-out infinite}
@keyframes mailping{0%{opacity:.8;transform:scale(.92)}70%,100%{opacity:0;transform:scale(1.12)}}
.clock{position:absolute;inset:calc(10px * var(--s)) 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;white-space:nowrap}
.clock .t{font-size:calc(46px * var(--s));font-weight:500;color:#a3a9af;letter-spacing:.04em;line-height:1}
.clock .t i{font-style:normal;animation:colon 1s steps(1) infinite}
@keyframes colon{50%{opacity:0}}
.clock .d{font-size:calc(16px * var(--s));font-weight:700;color:#aeb4ba;margin-top:calc(4px * var(--s))}

/* ───────────────────────── channel ───────────────────────── */
#ch{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#fff;transform-origin:0 0;overflow:hidden}
#ch.open{display:flex}
#ch .stage{position:relative;flex:1;min-height:0;overflow:hidden}
.banner,.inside{position:absolute;inset:0}
.inside{overflow:auto;background:var(--bg) repeating-linear-gradient(180deg,transparent 0 3px,var(--stripe) 3px 4px);opacity:0;visibility:hidden}
#ch.in .inside{opacity:1;visibility:visible}
#ch.in .banner{visibility:hidden}
.fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity .22s}
.fade.on{opacity:1}

/* banner */
.banner{background:#141414;overflow:hidden}
.banner .bg{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(26px) saturate(1.15) brightness(.85);animation:pan 20s ease-in-out infinite alternate}
.banner .bg.light{filter:none}
@keyframes pan{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-3%,-2%)}}
.banner .bgstrip{position:absolute;inset:0;display:flex;width:200%;opacity:.55;animation:strip 40s linear infinite}
.banner .bgstrip img{width:50%;height:100%;object-fit:cover}
.fan{position:absolute;inset:0;display:grid;place-items:center;perspective:1200px}
.fan .card{grid-area:1/1;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.9)}
.fan .card img,.fan .card video{width:100%;height:100%;object-fit:cover}
.fan .c{height:min(58vh,540px);aspect-ratio:var(--ar,1);z-index:2;animation:rise .7s .05s var(--ease) both}
.fan .l,.fan .r{height:min(42vh,380px);aspect-ratio:1;opacity:.95}
.fan .l{animation:fanL .8s .12s var(--ease) both}
.fan .r{animation:fanR .8s .12s var(--ease) both}
@keyframes rise{from{transform:translateY(40px) scale(.92);opacity:0}}
@keyframes fanL{from{transform:none;opacity:0}to{transform:translateX(-62%) rotate(-9deg)}}
@keyframes fanR{from{transform:none;opacity:0}to{transform:translateX(62%) rotate(9deg)}}
.banner .name{position:absolute;left:0;right:0;bottom:clamp(16px,3vh,30px);text-align:center;z-index:3}
.banner .name b{display:inline-block;background:#fff;color:var(--ink-strong);border:3px solid var(--blue);border-radius:99px;padding:6px 24px;font-size:clamp(16px,2.2vw,24px);font-weight:800;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:rise .6s .25s var(--ease) both}
.banner .name small{display:block;margin-top:8px;color:rgba(255,255,255,.85);font-weight:700;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5);animation:rise .6s .32s var(--ease) both}
.banner.light{background:linear-gradient(160deg,#fff 0%,#e7f4fb 100%)}
.banner.light .name small{color:var(--muted);text-shadow:none}
.marquee{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;transform:rotate(-6deg) scale(1.15)}
.marquee .row{display:flex;gap:16px;width:max-content;animation:mq 50s linear infinite}
.marquee .row.rev{animation-direction:reverse;animation-duration:60s}
.marquee img{width:clamp(130px,16vw,210px);aspect-ratio:1;object-fit:cover;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
@keyframes mq{to{transform:translateX(-50%)}}
.bdisc{position:absolute;inset:0;display:grid;place-items:center}
.bdisc .disc{height:min(56vh,440px);filter:drop-shadow(0 20px 30px rgba(20,30,60,.2));animation:rise .7s var(--ease) both}
.bmail{position:absolute;inset:0;display:grid;place-items:center}
.bmail .env{width:min(42vw,300px);position:relative;animation:rise .7s var(--ease) both}
.bmail .letter{position:absolute;left:12%;right:12%;top:8%;height:70%;background:#fff;border-radius:8px;border:3px solid #dfe3e7;padding:8% 9%;animation:letter 1.6s .5s var(--ease) both}
.bmail .letter i{display:block;height:7px;border-radius:4px;background:#e3e7eb;margin-bottom:9px}
.bmail .letter i:first-child{width:55%;background:#b6e6f9}
@keyframes letter{from{transform:translateY(40%)}to{transform:translateY(-38%)}}
.bmail .env svg{position:relative;width:100%;height:auto;display:block}

/* footer pills */
#ch .foot{flex:none;position:relative;z-index:6;border-top:3px solid #dfe2e5;background:linear-gradient(#f8f9fa,#eceef0);display:flex;justify-content:center;gap:clamp(12px,5vw,80px);padding:16px}
.pill{min-width:clamp(140px,22vw,250px);padding:13px 28px;border-radius:99px;background:linear-gradient(#fff,#f2f4f6);border:3px solid #cbd0d4;
  font-weight:800;font-size:clamp(15px,1.8vw,19px);color:var(--ink-strong);text-align:center;text-decoration:none;box-shadow:0 3px 0 #b9bec3;transition:border-color .18s,transform .18s,box-shadow .18s}
.pill:hover,.pill:focus-visible{border-color:var(--blue);box-shadow:0 3px 0 #b9bec3,0 0 0 4px var(--glow);transform:translateY(-2px);outline:0}
.pill[hidden]{display:none}

/* inside a channel */
.wrap{max-width:1100px;margin:0 auto;padding:clamp(22px,4vw,48px) 18px 48px}
.head{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.head .tab{display:inline-block;background:#fff;border:2px solid #d9dde1;border-radius:99px;padding:2px 14px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep)}
.head h2{font-size:clamp(30px,5vw,58px);font-weight:800;color:var(--ink-strong);line-height:1.04;margin-top:10px}
.head .sub{font-weight:700;color:var(--ink);margin-top:4px}
.desc{max-width:62ch;margin-top:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px;margin-top:28px}
.gal figure{position:relative;border-radius:14px;overflow:hidden;background:#fff;border:2px solid var(--edge);box-shadow:inset 0 0 0 3px #fff,0 2px 0 rgba(0,0,0,.04);transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.gal figure:hover{transform:translateY(-3px) scale(1.02);border-color:var(--blue);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--glow)}
.gal .m{aspect-ratio:1;overflow:hidden;margin:3px 3px 0;border-radius:10px;background:#eceef0}
.gal img,.gal video{width:100%;height:100%;object-fit:cover}
.gal figcaption{font-size:12px;padding:7px 11px 9px;line-height:1.3;font-weight:700;color:var(--ink-strong)}
.gal figcaption span{display:block;color:var(--muted);font-weight:500}
.gal .badge{position:absolute;left:10px;top:10px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 9px;letter-spacing:.04em}
.yt{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;margin-top:26px;border:3px solid #fff;outline:2px solid var(--edge);background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.list{margin-top:24px;display:grid;gap:10px;max-width:560px}
.list a{display:flex;justify-content:space-between;gap:12px;background:#fff;border:2px solid var(--edge);box-shadow:inset 0 0 0 3px #fff;border-radius:16px;padding:13px 18px;text-decoration:none;font-weight:700;color:var(--ink-strong);transition:border-color .18s,box-shadow .18s}
.list a:hover{border-color:var(--blue);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--glow)}
.list a span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips span{background:#fff;border:2px solid #d4ecf8;border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px;color:var(--ink-strong)}
.about{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center}
.about .disc{width:clamp(120px,18vw,210px)}

/* photo viewer */
#viewer{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:rgba(244,245,246,.97) repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.02) 3px 4px)}
#viewer.open{display:flex;animation:vIn .25s ease both}
@keyframes vIn{from{opacity:0}}
#viewer .vstage{flex:1;min-height:0;display:grid;place-items:center;padding:20px 76px}
#viewer .media{max-width:min(100%,calc(100vw - 152px));max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);width:auto;height:auto;object-fit:contain;border-radius:14px;border:4px solid #fff;box-shadow:0 18px 50px rgba(0,0,0,.18);background:#fff;animation:vPop .3s var(--ease) both}
@keyframes vPop{from{transform:scale(.94);opacity:0}}
#viewer .vbar{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 16px 18px;flex-wrap:wrap}
#viewer .cap{font-weight:700;color:var(--ink-strong);text-align:center;min-width:200px}
#viewer .cap span{display:block;color:var(--muted);font-weight:500;font-size:13px}
#viewer .arrow{top:50%;translate:0 -50%}
#viewer .arrow.prev{left:14px}#viewer .arrow.next{right:14px}
#viewer .pill{min-width:120px;padding:9px 22px;font-size:15px}

@media (max-width:820px){
  :root{--s:.74}
  .page{grid-template-columns:repeat(2,1fr)}
  .menu{padding:28px 14px 170px}
  .arrow{top:auto;bottom:calc(150px * var(--s) + 22px);width:40px;height:44px}
  .arrow.prev{left:12px}.arrow.next{right:12px}
  .tag{font-size:11px;padding:0 9px}
  .boot-copy{top:auto;bottom:70px;transform:none;max-width:calc(100% - 140px)}
  #bootDisc{left:40%;top:36%;width:min(46vw,220px)}
  .disc-shadow{left:40%;top:calc(36% + min(23vw,110px) + 10px)}
  .console{height:min(62vh,520px)}
  .about{grid-template-columns:1fr}
  #viewer .vstage{padding:12px}
  #viewer .media{max-width:calc(100vw - 24px);max-height:calc(100dvh - 190px)}
  #viewer .arrow{top:auto;bottom:86px;translate:none}
  .fan .l,.fan .r{display:none}
}
@media (max-width:520px){
  :root{--s:.56}
  .menu{padding-bottom:130px}
  .clock .t{font-size:28px}
  .clock .d{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.tile{opacity:1}}
</style>
</head>

  <div class="console" aria-hidden="true">

        <linearGradient id="cFace" x1="0" x2="1"><stop offset="0" stop-color="#e3e7ea"/><stop offset=".6" stop-color="#fdfdfe"/><stop offset="1" stop-color="#eef1f3"/></linearGradient>

      </defs>
      <ellipse cx="88" cy="630" rx="74" ry="7" fill="#000" opacity=".08"/>

      <rect x="35" y="430" width="8" height="2" rx="1" fill="#cfd4d9"/>

      <g fill="#c6ccd1" opacity=".75"><rect x="112" y="64" width="18" height="3" rx="1.5"/><rect x="112" y="74" width="18" height="3" rx="1.5"/><rect x="112" y="84" width="18" height="3" rx="1.5"/><rect x="112" y="94" width="18" height="3" rx="1.5"/><rect x="112" y="104" width="18" height="3" rx="1.5"/><rect x="112" y="114" width="18" height="3" rx="1.5"/></g>
    </svg>
    <div class="slot-glow"></div>
  </div>
  <div class="whiteout"></div>

<!-- ═════════════ MENU ═════════════ -->

  <div class="pages"><div class="track" id="track"></div></div>

<!-- ═════════════ PHOTO VIEWER ═════════════ -->
<div id="viewer" role="dialog" aria-modal="true" aria-label="Viewer">
  <div class="vstage" id="vStage"></div>
  <button class="arrow prev" id="vPrev" aria-label="Previous"><svg viewBox="0 0 20 32"><path d="M15 3 4 16l11 13" fill="none" stroke="#34bdef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <div class="vbar"><div class="cap" id="vCap"></div><button class="pill" id="vClose">Close</button></div>
</div>

<script src="assets/data.js"></script>
<script>
(() => {
const D = window.PORTFOLIO;
const I = n => `assets/img/${n}.webp`, S = n => `assets/img/${n}-s.webp`, V = n => `assets/video/${n}.mp4`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isExt = u => /^(https?:|mailto:)/.test(u);

/* ── disc artwork (label printed with the face logo) ── */
let discN = 0;
function discHTML(cls = '') {
  const id = 'dl' + (discN++);
  return `<div class="disc ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><clipPath id="${id}"><circle cx="50" cy="50" r="45.6"/></clipPath></defs>
    <path d="M50 4.4a45.6 45.6 0 1 1 0 91.2a45.6 45.6 0 1 1 0-91.2zM50 37.5a12.5 12.5 0 1 0 0 25a12.5 12.5 0 1 0 0-25z" fill="#fff" fill-rule="evenodd"/>
    <g clip-path="url(#${id})">
      <image href="assets/img/logo-face.png" x="32.5" y="5.5" width="35" height="35"/>
      <text x="50" y="73.5" text-anchor="middle" font-family="M PLUS Rounded 1c, sans-serif" font-weight="800" font-size="7.4" letter-spacing=".5" fill="#17176b">BATUARCHV</text>
      <text x="50" y="80.5" text-anchor="middle" font-family="M PLUS Rounded 1c, sans-serif" font-weight="700" font-size="3.1" letter-spacing=".5" fill="#8c92a6">COVER ART &amp; VISUALS</text>
    </g>
    <circle cx="50" cy="50" r="44" fill="none" stroke="#17176b" stroke-width=".35" opacity=".5"/>
    <path d="M50 37.5a12.5 12.5 0 1 1 0 25a12.5 12.5 0 1 1 0-25zM50 43a7 7 0 1 0 0 14a7 7 0 1 0 0-14z" fill="#dfe4ea" fill-opacity=".55" fill-rule="evenodd"/>
    <circle cx="50" cy="50" r="10.2" fill="none" stroke="#fff" stroke-width=".6" opacity=".9"/>
    <circle cx="50" cy="50" r="12.5" fill="none" stroke="#c9cfd6" stroke-width=".4"/>
  </svg></div>`;
}
const envSVG = (stroke = '#34bdef') => `<svg viewBox="0 0 48 36" fill="#fff" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"><rect x="3" y="3" width="42" height="30" rx="5"/><path d="M4 6l20 15L44 6" fill="none"/></svg>`;

/* ── channels ── */
const F = D.featured, [tape, crash, curs] = D.highlights;
const rot = (names, delay = 0) => `<div class="rot" data-delay="${delay}">${names.map((n, i) => `<img src="${S(n)}" alt="" loading="lazy" class="${i ? '' : 'on'}" style="--d:-${(delay * 3) % 14}s">`).join('')}</div>`;
const kb = (n, pos = '', d = 0) => `<div class="kb"><img src="${S(n)}" alt="" loading="lazy" style="--d:-${d}s;${pos ? 'object-position:' + pos : ''}"></div>`;
const coverNames = D.covers.map(c => c.src);
const otherNames = D.other.map(o => o.src);
const chunk = (arr, n, k) => arr.filter((_, i) => i % n === k);

const CH = {
  about: { label: 'Disc Channel', tag: 'batuarchv', kind: 'disc',
    tile: `<div class="tdisc">${discHTML('spin')}<div><b>batuarchv</b><small>Disc Channel</small></div></div>`,
    title: 'Hi, I’m batu.', sub: D.role, about: true },
  '80b': { label: '80B Channel', tag: '80B', kind: '80b', cards: ['80b-cover', '80b-logo', 'yalniz'],
    tile: `<div class="t80" style="position:absolute;inset:0"><div class="strip"><img src="${S('80b-pattern')}" alt=""><img src="${S('80b-pattern')}" alt=""></div><div class="card"><img src="${S('80b-cover')}" alt=""></div></div>`,
    title: F.title, sub: `${F.artist} · ${F.year}`, desc: F.text, yt: F.video.id, tabText: F.kind,
    items: F.images.map(i => ({ src: i.src, title: i.alt })) },
  covers: { label: 'Covers Channel', tag: `Covers · ${D.covers.length}`, kind: 'marquee',
    tile: `<div class="mos">${[0, 1, 2].map(k => rot(chunk(coverNames, 3, k).slice(0, 8), k)).join('')}</div>`,
    title: 'Covers', sub: `${D.covers.length} releases`, desc: 'Single, EP and album artwork.', ext: ['Genius credits', 'https://genius.com/artists/batuarchv'],
    items: D.covers.map(c => ({ src: c.src, title: c.title, meta: `${c.artist} · ${c.year}` })) },
  tape: { label: tape.title, tag: tape.title, kind: 'cards', cards: tape.images, bg: 'tape-2', ar: '1069/1400',
    tile: `<div style="position:absolute;inset:0">${rot(['tape-1', 'tape-2'], 1)}</div>`,
    title: tape.title, sub: `${tape.artist} · ${tape.year}`, desc: tape.note + '.', ext: ['See post', tape.url],
    items: tape.images.map(n => ({ src: n, title: tape.title })) },
  crash: { label: crash.title, tag: crash.title, kind: 'cards', cards: ['crashout'], bg: 'crashout', ar: '9/16',
    tile: kb('crashout', 'center 42%', 4),
    title: crash.title, sub: `${crash.artist} · ${crash.year}`, desc: crash.note + '.', ext: ['Watch reel', crash.url],
    items: crash.images.map(n => ({ src: n, title: crash.title })) },
  video: { label: 'YALNIZ — Music Video', tag: 'YALNIZ — video', kind: 'cards', cardUrl: `https://i.ytimg.com/vi/${F.video.id}/hqdefault.jpg`, ar: '16/9', cursor: 'c-camera',
    tile: `<div class="tvid" style="position:absolute;inset:0"><div class="kb"><img src="https://i.ytimg.com/vi/${F.video.id}/hqdefault.jpg" alt="" style="--d:-6s"></div><span class="play"></span></div>`,
    title: 'YALNIZ', sub: 'sulga & ocean · music video · 2025', desc: 'Music video from the 80B album.', yt: F.video.id,
    ext: ['Open on YouTube', `https://www.youtube.com/watch?v=${F.video.id}`] },
  cursors: { label: 'Wii Cursors', tag: 'Wii Cursors', kind: 'cards', cards: curs.images, bg: 'wii-2', ar: '1/1',
    tile: `<div class="tcur">${kb('wii-1', '', 2)}<img class="fly" src="assets/cursors/select@2x.png" alt=""><img class="fly b" src="assets/cursors/link@2x.png" alt=""></div>`,
    title: curs.title, sub: curs.note, desc: "The pointer you're holding right now. 20+ HiDPI Wii-style cursors for macOS & Windows — free on Gumroad.",
    ext: ['Get them', curs.url], items: curs.images.map(n => ({ src: n, title: curs.title })) },
  other: { label: 'Other Work', tag: 'Other work', kind: 'cards', cards: ['poster-1', 'sagoba-merch', 'acab'], bg: 'poster-2',
    tile: `<div class="mos">${[0, 1, 2].map(k => rot(chunk(otherNames, 3, k), k + 3)).join('')}</div>`,
    title: 'Other work', sub: 'Merch · posters · illustration', desc: 'Things that are not (only) covers.', ext: ['Old archive', 'https://x.com/batuarchvold'],
    items: D.other.map(o => ({ src: o.src, title: o.title, meta: o.year })) },
  mail: { label: 'Message Board', tag: 'Message Board', kind: 'mail',
    tile: `<div class="tmail"><div class="env">${envSVG()}<span class="badge">1</span></div></div>`,
    title: 'Message Board', sub: 'Got a release coming up?', desc: 'Covers, release identities, merch, canvases and motion. Write to the work address for projects.', mail: true,
    ext: ['Write an e-mail', 'mailto:' + D.workEmail] },
};
for (const a of D.artists) {
  const imgs = a.items.filter(i => !i.video).map(i => i.src);
  const vid = a.items.find(i => i.video);
  CH['a-' + a.key] = { label: a.label, tag: a.label, kind: 'cards', cards: [a.art, ...imgs.filter(n => n !== a.art)].slice(0, 3), bg: a.art, video: vid && vid.video,
    tile: `<div style="position:absolute;inset:0">${rot([a.art, ...imgs.filter(n => n !== a.art)].slice(0, 3), a.key.length)}</div>${vid ? `<video class="hv" muted loop playsinline preload="none" data-src="${V(vid.video)}"></video>` : ''}`,
    title: a.label, sub: `${a.sub} · ${a.year}`, desc: a.desc, items: a.items.map(i => ({ ...i, meta: i.video ? 'canvas · loop' : '' })) };
}
const PAGES = [
  ['about', '80b', 'covers', 'tape', 'crash', 'video', 'cursors', 'other', 'mail'],
  D.artists.map(a => 'a-' + a.key),
].filter(p => p.length);

/* ── build pages ── */
const track = $('track');
let n = 0;
track.innerHTML = PAGES.map((keys, p) => {
  const tiles = keys.map(k => {
    const c = CH[k];
    return `<div class="tile ${c.cursor || ''}" style="--i:${n++}" role="button" tabindex="0" data-ch="${k}" aria-label="${esc(c.label)}"><div class="view">${c.tile}</div><span class="tag">${esc(c.tag || c.label)}</span></div>`;
  });
  while (tiles.length < 12) tiles.push(`<div class="tile empty c-forbidden" style="--i:${n++}" aria-hidden="true"></div>`);
  return `<section class="page" data-page="${p}" aria-label="Page ${p + 1}">${tiles.join('')}</section>`;
}).join('');
$('dots').innerHTML = PAGES.length > 1 ? PAGES.map((_, i) => `<button aria-label="Page ${i + 1}"></button>`).join('') : '';

let page = 0;
function goPage(p) {
  page = Math.max(0, Math.min(PAGES.length - 1, p));
  track.style.transform = `translateX(${-100 * page}%)`;
  document.querySelectorAll('.page').forEach((el, i) => { el.inert = i !== page; });
  $('prev').hidden = page === 0; $('next').hidden = page === PAGES.length - 1;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === page));
  try { sessionStorage.setItem('page', page); } catch (_) {}
}
$('prev').onclick = () => goPage(page - 1);
$('next').onclick = () => goPage(page + 1);
[...$('dots').children].forEach((d, i) => d.onclick = () => goPage(i));
let startPage = 0; try { startPage = +sessionStorage.getItem('page') || 0; } catch (_) {}
goPage(startPage);

/* swipe between pages on touch */
let sw = null;
track.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') sw = { x: e.clientX, y: e.clientY }; });
track.addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { goPage(page + (dx < 0 ? 1 : -1)); swallowClick = true; setTimeout(() => swallowClick = false, 50); }
});
let swallowClick = false;

/* crossfade rotators — only on the visible page, only when nothing is open */
let tick = 0;
setInterval(() => {
  if (document.hidden || chOpen || reduce) return;
  tick++;
  document.querySelectorAll(`.page[data-page="${page}"] .rot`).forEach((r, idx) => {
    if ((tick + idx) % 2) return;            // stagger so tiles don't change in lockstep
    const imgs = r.children; if (imgs.length < 2) return;
    const cur = [...imgs].findIndex(i => i.classList.contains('on'));
    imgs[cur].classList.remove('on'); imgs[(cur + 1) % imgs.length].classList.add('on');
  });
}, 1700);

/* hover-preview canvases on artist tiles */
track.addEventListener('pointerover', e => {
  const t = e.target.closest('.tile'); const v = t && t.querySelector('video.hv'); if (!v || reduce) return;
  if (!v.src) v.src = v.dataset.src;
  v.play().then(() => v.classList.add('on')).catch(() => {});
});
track.addEventListener('pointerout', e => {
  const t = e.target.closest('.tile'); if (!t || t.contains(e.relatedTarget)) return;
  const v = t.querySelector('video.hv'); if (v) { v.pause(); v.classList.remove('on'); }
});

/* ── channel: zoom from tile → banner → (Start) → inside ── */
const ch = $('ch'), banner = $('banner'), inside = $('inside'), fade = $('fade'), back = $('chBack'), start = $('chStart');
let cur = null, curKey = null, fromEl = null, chOpen = false, stage = 'banner';

function bannerHTML(c) {
  const name = `<div class="name"><b id="chName">${esc(c.label)}</b><small>${esc(c.sub || '')}</small></div>`;
  if (c.kind === 'disc') return `<div class="bg light" style="background:linear-gradient(160deg,#fff,#e5f3fb)"></div><div class="bdisc">${discHTML('spin')}</div>${name}`;
  if (c.kind === 'mail') return `<div class="bmail"><div class="env"><div class="letter"><i></i><i></i><i></i><i></i></div>${envSVG('#9aa0a6')}</div></div>${name}`;
  if (c.kind === 'marquee') {
    const a = coverNames.slice(0, 14), b = coverNames.slice(14, 28);
    const row = (arr, rev) => `<div class="row${rev ? ' rev' : ''}">${[...arr, ...arr].map(n => `<img src="${S(n)}" alt="">`).join('')}</div>`;
    return `<div class="marquee">${row(a)}${row(b, 1)}${row(a.slice().reverse())}</div>${name}`;
  }
  const bg = c.kind === '80b' ? `<div class="bgstrip"><img src="${S('80b-pattern')}" alt=""><img src="${S('80b-pattern')}" alt=""></div>`
                              : `<div class="bg" style="background-image:url('${c.cardUrl || S(c.bg || c.cards[0])}')"></div>`;
  const cards = c.cards || [];
  const center = c.video ? `<div class="card c" style="--ar:9/16"><video src="${V(c.video)}" muted loop playsinline autoplay poster="${S(c.bg)}"></video></div>`
               : c.cardUrl ? `<div class="card c" style="--ar:${c.ar}"><img src="${c.cardUrl}" alt=""></div>`
               : `<div class="card c" style="--ar:${c.ar || '1'}"><img src="${I(cards[0])}" alt=""></div>`;
  const sideL = cards[1] ? `<div class="card l"><img src="${S(cards[1])}" alt=""></div>` : '';
  const sideR = cards[2] ? `<div class="card r"><img src="${S(cards[2])}" alt=""></div>` : (c.video && cards[0] ? `<div class="card r"><img src="${S(cards[0])}" alt=""></div>` : '');
  return `${bg}<div class="fan">${sideL}${sideR}${center}</div>${name}`;
}

function insideHTML(c) {
  let h = `<div class="wrap">`;
  if (c.about) {
    h += `<div class="about">${discHTML('spin')}<div class="head" style="display:block"><span class="tab">Disc Channel</span><h2>${esc(c.title)}</h2><p class="sub">${esc(c.sub)}</p><p class="desc">${esc(D.intro)}</p></div></div>
      <div class="chips">${D.clients.map(x => `<span>${esc(x)}</span>`).join('')}</div>`;
  } else {
    h += `<div class="head"><div><span class="tab">${esc(c.tabText || c.label)}</span><h2>${esc(c.title)}</h2><p class="sub">${esc(c.sub)}</p></div></div><p class="desc">${esc(c.desc)}</p>`;
  }
  if (c.yt) h += `<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${c.yt}" title="${esc(c.title)} — video" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
  if (c.mail || c.about) h += `<div class="list">
      <a class="c-link" href="mailto:${D.workEmail}">${D.workEmail}<span>work</span></a>
      <a class="c-link" href="mailto:${D.email}">${D.email}<span>personal</span></a>
      ${D.links.map(l => `<a class="c-link" href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}<span>↗</span></a>`).join('')}</div>`;
  if (c.items) h += `<div class="gal">${c.items.map((it, i) => `<figure class="c-zoom-in" data-i="${i}" tabindex="0" role="button" aria-label="Open ${esc(it.title)}">
      <div class="m">${it.video ? `<video muted loop playsinline preload="none" poster="${S(it.src)}" data-src="${V(it.video)}"></video>` : `<img src="${S(it.src)}" alt="${esc(it.title)}" loading="lazy">`}</div>
      ${it.video ? '<span class="badge">CANVAS</span>' : ''}
      <figcaption>${esc(it.title)}${it.meta ? `<span>${esc(it.meta)}</span>` : ''}</figcaption></figure>`).join('')}</div>`;
  return h + '</div>';
}

/* play inline canvases only while they're on screen */
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause();
}), { threshold: .25 });

function setStage(s) {
  stage = s;
  ch.classList.toggle('in', s === 'inside');
  if (s === 'inside') {
    inside.innerHTML = insideHTML(cur); inside.scrollTop = 0;
    inside.querySelectorAll('video[data-src]').forEach(v => io.observe(v));
    banner.querySelectorAll('video').forEach(v => v.pause());
    back.textContent = 'Back';
    if (cur.ext) { start.textContent = cur.ext[0]; start.hidden = false; start.classList.add('c-link'); } else start.hidden = true;
  } else {
    inside.querySelectorAll('video').forEach(v => { io.unobserve(v); v.pause(); });
    inside.innerHTML = '';
    banner.querySelectorAll('video').forEach(v => v.play().catch(() => {}));
    back.textContent = 'Wii Menu'; start.textContent = 'Start'; start.hidden = false; start.classList.remove('c-link');
  }
}
function crossfade(fn) {
  if (reduce) return fn();
  fade.classList.add('on');
  setTimeout(() => { fn(); requestAnimationFrame(() => fade.classList.remove('on')); }, 230);
}
function rectTransform(r) {
  const sx = r.width / innerWidth, sy = r.height / innerHeight;
  return `translate(${r.left}px,${r.top}px) scale(${sx},${sy})`;
}
function openCh(key, el) {
  const c = CH[key]; if (!c || chOpen) return;
  cur = c; curKey = key; fromEl = el || null; chOpen = true;
  document.body.classList.add('ch-open');
  banner.className = 'banner' + (c.kind === 'disc' || c.kind === 'mail' ? ' light' : '');
  banner.innerHTML = bannerHTML(c);
  setStage('banner');
  ch.classList.add('open'); ch.setAttribute('aria-hidden', 'false');
  const r = el && el.getBoundingClientRect && el.getBoundingClientRect();
  if (r && !reduce) {
    ch.animate([{ transform: rectTransform(r), borderRadius: '40px', opacity: .6 }, { transform: 'none', borderRadius: '0px', opacity: 1 }],
      { duration: 460, easing: 'cubic-bezier(.2,.85,.25,1)' });
  }
  start.focus({ preventScroll: true });
}
function closeCh() {
  if (!chOpen) return;
  const finish = () => {
    ch.classList.remove('open', 'in'); ch.setAttribute('aria-hidden', 'true');
    banner.innerHTML = ''; inside.innerHTML = ''; chOpen = false; document.body.classList.remove('ch-open');
    if (fromEl && fromEl.focus) fromEl.focus({ preventScroll: true });
  };
  const r = fromEl && fromEl.isConnected && fromEl.getBoundingClientRect();
  if (r && r.width && !reduce) {
    ch.animate([{ transform: 'none', borderRadius: '0px', opacity: 1 }, { transform: rectTransform(r), borderRadius: '40px', opacity: .4 }],
      { duration: 380, easing: 'cubic-bezier(.5,0,.75,0)' }).onfinish = finish;
  } else finish();
}
back.addEventListener('click', () => stage === 'inside' ? crossfade(() => setStage('banner')) : closeCh());
start.addEventListener('click', () => {
  if (stage === 'banner') return crossfade(() => setStage('inside'));
  if (cur.ext) { const u = cur.ext[1]; u.startsWith('mailto') ? (location.href = u) : window.open(u, '_blank', 'noopener'); }
});
banner.addEventListener('click', () => stage === 'banner' && crossfade(() => setStage('inside')));

/* ── viewer ── */
const viewer = $('viewer'), vStage = $('vStage');
let vItems = [], vIdx = 0;
function showV(i) {
  vIdx = (i + vItems.length) % vItems.length;
  const it = vItems[vIdx];
  vStage.innerHTML = it.video
    ? `<video class="media" src="${V(it.video)}" poster="${S(it.src)}" autoplay muted loop playsinline controls></video>`
    : `<img class="media c-zoom-out" src="${I(it.src)}" alt="${esc(it.title)}">`;
  $('vCap').innerHTML = `${esc(it.title)}<span>${vIdx + 1} / ${vItems.length}${it.meta ? ' · ' + esc(it.meta) : ''}</span>`;
  $('vPrev').hidden = $('vNext').hidden = vItems.length < 2;
}
function openV(items, i) { vItems = items; viewer.classList.add('open'); showV(i); $('vClose').focus({ preventScroll: true }); }
function closeV() { viewer.classList.remove('open'); vStage.innerHTML = ''; }
$('vPrev').onclick = () => showV(vIdx - 1);
$('vNext').onclick = () => showV(vIdx + 1);
$('vClose').onclick = closeV;
vStage.addEventListener('click', e => { if (e.target.tagName === 'IMG' || e.target === vStage) closeV(); });
let vs = null;
vStage.addEventListener('pointerdown', e => { vs = e.clientX; });
vStage.addEventListener('pointerup', e => { if (vs == null) return; const dx = e.clientX - vs; vs = null; if (Math.abs(dx) > 60) { e.stopPropagation(); showV(vIdx + (dx < 0 ? 1 : -1)); } });

/* ── global clicks & keys ── */
document.addEventListener('click', e => {
  if (swallowClick) return;
  const t = e.target.closest('[data-ch]');
  if (t && !chOpen) { e.preventDefault(); return openCh(t.dataset.ch, t.classList.contains('tile') ? t : null); }
  const f = e.target.closest('#inside figure[data-i]');
  if (f) openV(cur.items, +f.dataset.i);
});
document.addEventListener('keydown', e => {
  if (viewer.classList.contains('open')) {
    if (e.key === 'Escape') closeV(); else if (e.key === 'ArrowRight') showV(vIdx + 1); else if (e.key === 'ArrowLeft') showV(vIdx - 1);
    return;
  }
  if (chOpen) {
    if (e.key === 'Escape') { e.preventDefault(); stage === 'inside' ? crossfade(() => setStage('banner')) : closeCh(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('figure[data-i]')) { e.preventDefault(); openV(cur.items, +e.target.dataset.i); }
    return;
  }
  if (!document.body.classList.contains('booted')) return;
  if (e.key === 'ArrowRight') goPage(page + 1);
  if (e.key === 'ArrowLeft') goPage(page - 1);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tile[data-ch]')) { e.preventDefault(); openCh(e.target.dataset.ch, e.target); }
});
document.addEventListener('visibilitychange', () => document.body.classList.toggle('paused', document.hidden));

/* ── boot: drag (or click) the disc into the slot ── */
const boot = $('boot'), disc = $('bootDisc');
disc.outerHTML = discHTML('float c-open').replace('<div class="disc', '<div id="bootDisc" role="button" tabindex="0" aria-label="Insert the disc to enter the site" class="disc');
const bd = $('bootDisc');
let booted = false;
function reveal(instant) {
  if (booted) return; booted = true;
  try { sessionStorage.setItem('booted', '1'); } catch (_) {}
  document.body.classList.remove('c-wait');
  const done = () => { boot.classList.add('gone'); document.body.classList.add('booted'); setTimeout(() => boot.remove(), 700); };
  if (instant) { boot.style.transition = 'none'; return done(); }
  boot.classList.add('white'); setTimeout(done, 520);
}
function insert(dx = 0, dy = 0) {
  if (booted || boot.classList.contains('inserting')) return;
  boot.classList.add('inserting'); document.body.classList.add('c-wait');
  bd.classList.remove('float', 'c-open', 'c-closed');
  const slot = boot.querySelector('.slot').getBoundingClientRect();
  const r = bd.getBoundingClientRect();
  const cx = r.left + r.width / 2 - dx, cy = r.top + r.height / 2 - dy;           // disc centre without the drag offset
  const tx = slot.left + slot.width / 2 - cx, ty = slot.top + slot.height / 2 - cy, w = r.width;
  const T = (x, y, ry, rz) => `translate(${x}px,${y}px) perspective(1000px) rotateY(${ry}deg) rotate(${rz}deg)`;
  const a = bd.animate([
    { transform: T(dx, dy, 0, 0) },
    { transform: T(tx - w * .62, ty, 18, 160), offset: .45 },
    { transform: T(tx - w * .02, ty, 86, 300), offset: .78 },
    { transform: T(tx + w * .55, ty, 88, 380) },
  ], { duration: 1150, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' });
  setTimeout(() => {
    boot.classList.add('on');
    boot.querySelector('.console').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(1px)' }, { transform: 'translateX(0)' }], { duration: 260 });
  }, 880);
  a.onfinish = () => setTimeout(() => reveal(false), 650);
}
let skip = false; try { skip = sessionStorage.getItem('booted') === '1'; } catch (_) {}
if (skip || reduce) reveal(true);
$('skip').onclick = () => reveal(true);

let drag = null;
bd.addEventListener('pointerdown', e => {
  if (boot.classList.contains('inserting')) return;
  e.preventDefault();
  drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false };
  bd.setPointerCapture(e.pointerId); bd.classList.remove('float', 'c-open'); bd.classList.add('c-closed');
});
bd.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
  if (Math.abs(drag.dx) + Math.abs(drag.dy) > 5) drag.moved = true;
  bd.style.transform = `translate(${drag.dx}px,${drag.dy}px) rotate(${drag.dx / 5}deg)`;
  const cr = boot.querySelector('.console').getBoundingClientRect();
  boot.classList.toggle('near', e.clientX > cr.left - 240);
});
const endDrag = e => {
  if (!drag) return;
  const { dx, dy, moved } = drag; drag = null;
  bd.classList.remove('c-closed');
  const cr = boot.querySelector('.console').getBoundingClientRect();
  if (!moved || e.clientX > cr.left - 240) { bd.style.transform = ''; insert(dx, dy); }
  else {
    boot.classList.remove('near');
    bd.animate([{ transform: bd.style.transform }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.3,1.4,.5,1)' }).onfinish = () => { bd.classList.add('float', 'c-open'); };
    bd.style.transform = '';
  }
};
bd.addEventListener('pointerup', endDrag);
bd.addEventListener('pointercancel', endDrag);
bd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); insert(); } });

/* ── clock ── */
function clock() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  $('time').innerHTML = `${hh}<i>:</i>${mm}`;
  $('date').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
  setTimeout(clock, (60 - d.getSeconds()) * 1000 + 50);
}
clock();
})();
</script>
